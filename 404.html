<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 – lost trail</title>
  <style>
    :root {
      /* ===== light violet + pink palette ===== */
      --violet-100: #f5edff;
      --violet-200: #e9d5ff;
      --violet-300: #d8b4fe;
      --violet-400: #c084fc;
      --violet-500: #a855f7;
      --violet-600: #8b5cf6;
      --violet-700: #7c3aed;
      --violet-900: #4c1d95;

      --pink-100: #fdf2f8;
      --pink-200: #fbcfe8;
      --pink-300: #f9a8d4;
      --pink-400: #f472b6;
      --pink-500: #ec4899;

      --bg-soft: #fdf8ff;      /* soft lavender parchment */
      --text-main: #3d2a55;
      --text-soft: #5b4380;
      --border-soft: #e6d7f5;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(170deg, #fdf9ff 0%, #fdf3fa 45%, #f6f1ff 100%);
      overflow: hidden;
      position: relative;
      cursor: default;
      color: var(--text-main);
    }

    /* ============================================================
       ANIMATED BACKGROUND – ADVENTURE TOURISM THEME
       ============================================================ */
    .background-animation {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    /* ---------- faint travel-map grid ---------- */
    .map-grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(168, 85, 247, 0.075) 1px, transparent 1px),
        linear-gradient(90deg, rgba(168, 85, 247, 0.075) 1px, transparent 1px);
      background-size: 60px 60px;
      -webkit-mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
      mask-image: radial-gradient(circle at 50% 45%, #000 0%, transparent 78%);
      animation: gridDrift 26s ease-in-out infinite;
    }
    @keyframes gridDrift {
      0%, 100% { transform: translate(0, 0); }
      50%      { transform: translate(14px, -14px); }
    }

    /* ---------- warm sunset glow ---------- */
    .sun-glow {
      position: absolute;
      top: -160px;
      right: -140px;
      width: 540px;
      height: 540px;
      border-radius: 50%;
      background: radial-gradient(circle,
                  rgba(249, 168, 212, 0.60) 0%,
                  rgba(196, 132, 252, 0.30) 42%,
                  transparent 72%);
      filter: blur(28px);
      animation: sunPulse 9s ease-in-out infinite;
    }
    @keyframes sunPulse {
      0%, 100% { transform: scale(1);    opacity: 0.85; }
      50%      { transform: scale(1.12); opacity: 1; }
    }

    /* ---------- drifting clouds ---------- */
    .cloud {
      position: absolute;
      height: 38px;
      border-radius: 100px;
      background: linear-gradient(180deg, rgba(255,255,255,0.95), rgba(243,232,255,0.65));
      box-shadow: 0 10px 40px rgba(168, 85, 247, 0.12);
      opacity: 0.8;
    }
    .cloud::before,
    .cloud::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      background: inherit;
    }
    .cloud::before { width: 54px; height: 54px; top: -26px; left: 18px; }
    .cloud::after  { width: 38px; height: 38px; top: -18px; right: 22px; }

    .cloud-1 { width: 130px; top: 13%; left: -25%; animation: drift 48s linear infinite; }
    .cloud-2 { width:  96px; top: 30%; left: -25%; animation: drift 64s linear infinite -18s; opacity: 0.6; }
    .cloud-3 { width: 150px; top: 62%; left: -25%; animation: drift 78s linear infinite -40s; opacity: 0.5; }
    .cloud-4 { width:  80px; top:  8%; left: -25%; animation: drift 56s linear infinite -30s; opacity: 0.65; }

    @keyframes drift {
      0%   { transform: translateX(0); }
      100% { transform: translateX(145vw); }
    }

    /* ---------- airplane + contrail ---------- */
    .plane {
      position: absolute;
      top: 20%;
      left: -15%;
      width: 30px;
      height: 30px;
      color: var(--violet-500);
      filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.65));
      animation: flyAcross 26s linear infinite;
    }
    .plane svg { width: 100%; height: 100%; display: block; }

    .plane-trail {
      position: absolute;
      right: 100%;
      top: 50%;
      width: 190px;
      height: 0;
      margin-right: 8px;
      border-top: 2px dashed rgba(196, 132, 252, 0.55);
      transform: translateY(-50%);
      border-radius: 2px;
    }

    @keyframes flyAcross {
      0%   { transform: translate(0, 0) rotate(0deg);          opacity: 0; }
      6%   { opacity: 1; }
      50%  { transform: translate(62vw, -8vh) rotate(-6deg); }
      94%  { opacity: 1; }
      100% { transform: translate(128vw, 5vh) rotate(4deg);    opacity: 0; }
    }

    /* ---------- birds ---------- */
    .bird {
      position: absolute;
      width: 26px;
      color: rgba(124, 58, 237, 0.5);
      opacity: 0;
      animation: birdFly 36s linear infinite;
    }
    .bird svg {
      width: 100%;
      display: block;
      animation: flap 1.1s ease-in-out infinite;
    }
    .bird-1 { top: 26%; left: -8%;  animation-duration: 36s; }
    .bird-2 { top: 34%; left: -8%;  animation-duration: 44s; animation-delay: -16s; width: 18px; }

    @keyframes flap {
      0%, 100% { transform: scaleY(1); }
      50%      { transform: scaleY(0.5); }
    }
    @keyframes birdFly {
      0%   { transform: translate(0, 0);         opacity: 0; }
      7%   { opacity: 0.9; }
      50%  { transform: translate(56vw, -6vh); }
      93%  { opacity: 0.9; }
      100% { transform: translate(122vw, 3vh);   opacity: 0; }
    }

    /* ---------- hot-air balloons ---------- */
    .balloon {
      position: absolute;
      bottom: -150px;
      opacity: 0;
      filter: drop-shadow(0 16px 26px rgba(168, 85, 247, 0.28));
      animation: rise linear infinite;
    }
    .balloon svg { width: 100%; display: block; }

    .balloon-1 { left: 12%; width: 62px; animation-duration: 32s; animation-delay: 0s; }
    .balloon-2 { left: 74%; width: 46px; animation-duration: 40s; animation-delay: -14s; }
    .balloon-3 { left: 46%; width: 36px; animation-duration: 48s; animation-delay: -30s; }

    @keyframes rise {
      0%   { transform: translate(0, 0) rotate(-2deg);        opacity: 0; }
      8%   { opacity: 0.9; }
      50%  { transform: translate(42px, -72vh) rotate(4deg); }
      92%  { opacity: 0.9; }
      100% { transform: translate(-24px, -145vh) rotate(-3deg); opacity: 0; }
    }

    /* ---------- map pins ---------- */
    .map-pin {
      position: absolute;
      width: 26px;
      height: 26px;
      border-radius: 50% 50% 50% 0;
      transform: rotate(-45deg);
      background: linear-gradient(135deg, var(--pink-400), var(--violet-500));
      box-shadow: 0 0 22px rgba(236, 72, 153, 0.5);
      animation: pinPulse 3.8s ease-in-out infinite;
    }
    .map-pin::after {
      content: '';
      position: absolute;
      top: 50%;
      left: 50%;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #fff;
      transform: translate(-50%, -50%);
    }
    .pin-1 { top: 24%; left: 8%;  animation-delay: 0s; }
    .pin-2 { top: 58%; right: 11%; animation-delay: -1.3s; width: 20px; height: 20px; }
    .pin-3 { bottom: 26%; left: 16%; animation-delay: -2.4s; width: 16px; height: 16px; }

    @keyframes pinPulse {
      0%, 100% { scale: 1;    filter: brightness(1); }
      50%      { scale: 1.18; filter: brightness(1.15); }
    }

    /* ---------- compass rose ---------- */
    .compass {
      position: absolute;
      top: 12%;
      left: 7%;
      width: 84px;
      height: 84px;
      opacity: 0.7;
      animation: compassSpin 70s linear infinite;
    }
    .compass svg { width: 100%; height: 100%; display: block; }

    @keyframes compassSpin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ---------- layered mountain range ---------- */
    .mountains {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 46vh;
    }
    .mtn {
      position: absolute;
      left: -5%;
      width: 110%;
      bottom: 0;
    }
    .mtn-back {
      height: 100%;
      background: linear-gradient(180deg, rgba(216, 180, 254, 0.60), rgba(233, 213, 255, 0.30));
      clip-path: polygon(0% 100%, 0% 62%, 9% 38%, 18% 58%, 28% 24%, 37% 52%, 47% 30%,
                         57% 60%, 66% 28%, 75% 54%, 84% 34%, 92% 56%, 100% 40%, 100% 100%);
      opacity: 0.55;
    }
    .mtn-mid {
      height: 74%;
      background: linear-gradient(180deg, rgba(249, 168, 212, 0.60), rgba(244, 114, 182, 0.25));
      clip-path: polygon(0% 100%, 0% 55%, 12% 30%, 22% 55%, 33% 22%, 44% 52%, 55% 28%,
                         66% 56%, 78% 30%, 88% 54%, 100% 34%, 100% 100%);
      opacity: 0.5;
    }
    .mtn-front {
      height: 48%;
      background: linear-gradient(180deg, rgba(139, 92, 246, 0.55), rgba(109, 40, 217, 0.78));
      clip-path: polygon(0% 100%, 0% 50%, 10% 26%, 21% 52%, 32% 20%, 43% 48%, 54% 24%,
                         65% 52%, 76% 28%, 87% 50%, 100% 30%, 100% 100%);
      opacity: 0.45;
    }

    /* ---------- twinkling sparkles ---------- */
    .sparkle {
      position: absolute;
      width: 14px;
      height: 14px;
      background: radial-gradient(circle, #ffffff 0%, var(--pink-300) 45%, transparent 72%);
      clip-path: polygon(50% 0%, 61% 39%, 100% 50%, 61% 61%, 50% 100%, 39% 61%, 0% 50%, 39% 39%);
      opacity: 0;
      animation: twinkle 4.2s ease-in-out infinite;
    }
    .sparkle:nth-of-type(1) { top: 16%; left: 30%; animation-delay: 0s; }
    .sparkle:nth-of-type(2) { top: 44%; left: 88%; animation-delay: -1.1s; width: 10px; height: 10px; }
    .sparkle:nth-of-type(3) { top: 72%; left: 6%;  animation-delay: -2.2s; width: 12px; height: 12px; }
    .sparkle:nth-of-type(4) { top: 10%; left: 62%; animation-delay: -3.1s; width: 9px;  height: 9px; }
    .sparkle:nth-of-type(5) { top: 84%; left: 78%; animation-delay: -0.6s; width: 11px; height: 11px; }
    .sparkle:nth-of-type(6) { top: 56%; left: 40%; animation-delay: -2.7s; width: 8px;  height: 8px; }

    @keyframes twinkle {
      0%, 100% { opacity: 0;    transform: scale(0.5) rotate(0deg); }
      50%      { opacity: 0.95; transform: scale(1.15) rotate(45deg); }
    }

    /* ============ MAIN CONTENT ============ */
    .content-wrapper {
      position: relative;
      z-index: 10;
      text-align: center;
      padding: 40px 30px;
      max-width: 600px;
      width: 90%;
    }

    .error-code {
      font-size: clamp(120px, 20vw, 200px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg,
                  #fbcfe8 0%, #f472b6 25%, #c084fc 55%, #8b5cf6 78%, #6d28d9 100%);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: gradientShift 4.5s ease-in-out infinite;
      letter-spacing: -8px;
      user-select: none;
      position: relative;
    }
    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50%      { background-position: 100% 50%; }
    }

    .error-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle,
                  rgba(196, 132, 252, 0.45) 0%,
                  rgba(249, 168, 212, 0.28) 40%,
                  transparent 70%);
      filter: blur(45px);
      animation: glowPulse 3.4s ease-in-out infinite;
      pointer-events: none;
      border-radius: 50%;
    }
    @keyframes glowPulse {
      0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
      50%      { opacity: 1;   transform: translate(-50%, -50%) scale(1.2); }
    }

    .error-message {
      font-size: clamp(18px, 3vw, 28px);
      color: var(--violet-700);
      margin-top: 10px;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: 1px;
      text-shadow: 0 0 18px rgba(236, 72, 153, 0.55);
    }

    .error-description {
      font-size: clamp(14px, 2vw, 18px);
      color: var(--text-soft);
      margin-bottom: 35px;
      line-height: 1.6;
      max-width: 420px;
      margin-left: auto;
      margin-right: auto;
    }

    .button-group {
      display: flex;
      gap: 18px;
      justify-content: center;
      flex-wrap: wrap;
      align-items: center;
    }

    .btn {
      padding: 14px 32px;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
      letter-spacing: 0.5px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: none;
      outline: none;
      font-family: inherit;
      white-space: nowrap;
      background: transparent;
    }

    .btn svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
      transition: transform 0.3s ease;
    }

    /* back button – outline violet */
    .btn-back {
      color: var(--violet-700);
      border: 2.5px solid var(--violet-400);
      box-shadow: 0 0 20px rgba(168, 85, 247, 0.25), inset 0 0 15px rgba(216, 180, 254, 0.18);
      background: rgba(253, 248, 255, 0.55);
    }
    .btn-back:hover {
      background: rgba(233, 213, 255, 0.55);
      box-shadow: 0 0 40px rgba(196, 132, 252, 0.7), inset 0 0 25px rgba(249, 168, 212, 0.3);
      transform: translateY(-3px);
      border-color: var(--pink-300);
      color: var(--violet-900);
    }
    .btn-back:hover svg { transform: translateX(-4px); }
    .btn-back:active { transform: translateY(-1px) scale(0.98); }

    /* home button – filled pink→violet */
    .btn-home {
      background: linear-gradient(135deg, var(--pink-400), var(--violet-500));
      color: #fff7fd;
      border: 2.5px solid transparent;
      box-shadow: 0 8px 30px rgba(236, 72, 153, 0.55), 0 0 60px rgba(168, 85, 247, 0.4);
      position: relative;
      overflow: hidden;
    }
    .btn-home::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255, 240, 252, 0.65), transparent);
      transform: rotate(45deg) translateX(-100%);
      transition: transform 0.6s ease;
    }
    .btn-home:hover::before { transform: rotate(45deg) translateX(100%); }
    .btn-home:hover {
      background: linear-gradient(135deg, #f9a8d4, #a855f7);
      box-shadow: 0 12px 40px rgba(236, 72, 153, 0.75), 0 0 90px rgba(196, 132, 252, 0.6);
      transform: translateY(-3px) scale(1.03);
      color: #ffffff;
    }
    .btn-home:hover svg { transform: scale(1.15); }
    .btn-home:active { transform: translateY(-1px) scale(0.99); }

    .divider {
      width: 80px;
      height: 3px;
      background: linear-gradient(to right, transparent, var(--violet-300), var(--pink-300), transparent);
      margin: 20px auto 25px;
      border-radius: 3px;
      position: relative;
    }
    .divider::after {
      content: '✦';
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-size: 18px;
      background: var(--bg-soft);
      padding: 0 10px;
      color: var(--pink-500);
      text-shadow: 0 0 12px rgba(196, 132, 252, 0.95);
      animation: sparkle 2s ease-in-out infinite;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 1;   text-shadow: 0 0 10px #a855f7; }
      50%      { opacity: 0.7; text-shadow: 0 0 25px #f472b6; }
    }

    @media (max-width: 480px) {
      .content-wrapper { padding: 20px 15px; }
      .btn { padding: 12px 24px; font-size: 14px; width: 100%; justify-content: center; }
      .button-group { flex-direction: column; gap: 12px; width: 100%; max-width: 280px; margin: 0 auto; }
      .error-code { letter-spacing: -4px; }
      .divider { width: 60px; }
      .compass { width: 56px; height: 56px; top: 8%; left: 5%; }
      .mountains { height: 34vh; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="background-animation">
    <div class="map-grid"></div>
    <div class="sun-glow" data-depth="-18"></div>

    <!-- drifting clouds -->
    <div class="cloud cloud-1" data-depth="10"></div>
    <div class="cloud cloud-2" data-depth="7"></div>
    <div class="cloud cloud-3" data-depth="12"></div>
    <div class="cloud cloud-4" data-depth="6"></div>

    <!-- airplane with contrail -->
    <div class="plane" data-depth="5">
      <span class="plane-trail"></span>
      <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
    </div>

    <!-- birds -->
    <div class="bird bird-1" data-depth="8">
      <svg viewBox="0 0 32 16" aria-hidden="true">
        <path d="M2 12C7 3 11 3 16 9c5-6 9-6 14 3" fill="none" stroke="currentColor"
              stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="bird bird-2" data-depth="8">
      <svg viewBox="0 0 32 16" aria-hidden="true">
        <path d="M2 12C7 3 11 3 16 9c5-6 9-6 14 3" fill="none" stroke="currentColor"
              stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <!-- hot-air balloons -->
    <div class="balloon balloon-1" data-depth="6">
      <svg viewBox="0 0 64 100" aria-hidden="true">
        <defs>
          <linearGradient id="gradA" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#f9a8d4"/>
            <stop offset="55%"  stop-color="#c084fc"/>
            <stop offset="100%" stop-color="#8b5cf6"/>
          </linearGradient>
        </defs>
        <path d="M32 72 C19 64 8 51 8 34 C8 16 19 4 32 4 C45 4 56 16 56 34 C56 51 45 64 32 72 Z"
              fill="url(#gradA)"/>
        <path d="M32 4 C26 4 22 18 22 34 C22 50 26 64 32 72 C38 64 42 50 42 34 C42 18 38 4 32 4 Z"
              fill="#ffffff" opacity="0.22"/>
        <line x1="24" y1="69" x2="28" y2="82" stroke="#7c3aed" stroke-width="1.4" opacity="0.75"/>
        <line x1="40" y1="69" x2="36" y2="82" stroke="#7c3aed" stroke-width="1.4" opacity="0.75"/>
        <rect x="26" y="82" width="12" height="10" rx="2.5" fill="#7c3aed" opacity="0.9"/>
      </svg>
    </div>

    <div class="balloon balloon-2" data-depth="6">
      <svg viewBox="0 0 64 100" aria-hidden="true">
        <defs>
          <linearGradient id="gradB" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#e9d5ff"/>
            <stop offset="50%"  stop-color="#a855f7"/>
            <stop offset="100%" stop-color="#ec4899"/>
          </linearGradient>
        </defs>
        <path d="M32 72 C19 64 8 51 8 34 C8 16 19 4 32 4 C45 4 56 16 56 34 C56 51 45 64 32 72 Z"
              fill="url(#gradB)"/>
        <path d="M32 4 C36 4 40 18 40 34 C40 50 36 64 32 72 C28 64 24 50 24 34 C24 18 28 4 32 4 Z"
              fill="#ffffff" opacity="0.20"/>
        <line x1="24" y1="69" x2="28" y2="82" stroke="#7c3aed" stroke-width="1.4" opacity="0.75"/>
        <line x1="40" y1="69" x2="36" y2="82" stroke="#7c3aed" stroke-width="1.4" opacity="0.75"/>
        <rect x="26" y="82" width="12" height="10" rx="2.5" fill="#7c3aed" opacity="0.9"/>
      </svg>
    </div>

    <div class="balloon balloon-3" data-depth="6">
      <svg viewBox="0 0 64 100" aria-hidden="true">
        <defs>
          <linearGradient id="gradC" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%"   stop-color="#fbcfe8"/>
            <stop offset="60%"  stop-color="#f472b6"/>
            <stop offset="100%" stop-color="#a855f7"/>
          </linearGradient>
        </defs>
        <path d="M32 72 C19 64 8 51 8 34 C8 16 19 4 32 4 C45 4 56 16 56 34 C56 51 45 64 32 72 Z"
              fill="url(#gradC)"/>
        <path d="M32 4 C26 4 22 18 22 34 C22 50 26 64 32 72 C38 64 42 50 42 34 C42 18 38 4 32 4 Z"
              fill="#ffffff" opacity="0.25"/>
        <line x1="24" y1="69" x2="28" y2="82" stroke="#7c3aed" stroke-width="1.4" opacity="0.75"/>
        <line x1="40" y1="69" x2="36" y2="82" stroke="#7c3aed" stroke-width="1.4" opacity="0.75"/>
        <rect x="26" y="82" width="12" height="10" rx="2.5" fill="#7c3aed" opacity="0.9"/>
      </svg>
    </div>

    <!-- destination pins -->
    <div class="map-pin pin-1" data-depth="24"></div>
    <div class="map-pin pin-2" data-depth="18"></div>
    <div class="map-pin pin-3" data-depth="20"></div>

    <!-- compass rose -->
    <div class="compass" data-depth="20">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(168,85,247,0.40)" stroke-width="2"/>
        <circle cx="50" cy="50" r="34" fill="none" stroke="rgba(236,72,153,0.30)"
                stroke-width="1" stroke-dasharray="4 6"/>
        <polygon points="50,12 57,50 43,50" fill="#ec4899"/>
        <polygon points="50,88 57,50 43,50" fill="#a855f7"/>

  <div class="content-wrapper">
    <div class="error-glow"></div>
    <h1 class="error-code">404</h1>
    <div class="divider"></div>
    <p class="error-message">Page Not Found</p>
    <p class="error-description">
      Oops! This page wandered off the map. Let’s guide you back to base camp.
    </p>
    <div class="button-group">
      <button class="btn btn-back" onclick="goBack()" aria-label="Go back to previous page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"></line>
          <polyline points="12 19 5 12 12 5"></polyline>
        </svg>
        Go Back
      </button>
      <a href="/" class="btn btn-home" aria-label="Go back to homepage">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        Back to Home
      </a>
    </div>

  <script>
    function goBack() {
      if (document.referrer && document.referrer !== window.location.href) {
        window.history.back();
      } else {
        window.location.href = '/';
      }
    }

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { goBack(); }
    });

    /* gentle parallax – uses the standalone `translate` property so it
       never conflicts with the elements' transform-based animations */
    document.addEventListener('mousemove', function (e) {
      const x = (e.clientX / window.innerWidth - 0.5) * 2;
      const y = (e.clientY / window.innerHeight - 0.5) * 2;

      document.querySelectorAll('[data-depth]').forEach(function (el) {
        const depth = parseFloat(el.dataset.depth) || 0;
        el.style.translate = (x * depth) + 'px ' + (y * depth) + 'px';
      });
    });
  </script>
